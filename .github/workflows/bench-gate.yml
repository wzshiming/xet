name: Benchmark gate

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      base:
        description: Base ref
        required: true
        default: master
      head:
        description: Head ref, benchmarked against the base
        required: true
        default: master
      measure-identical:
        description: Measure packages whose test binaries are identical too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: wzshiming/benchgate@v0.0.1
      with:
        config: test/benchgate.json
        # These inputs are empty on a pull request, whose merge commit is then gated against its first parent.
        base: ${{ inputs.base }}
        head: ${{ inputs.head }}
        measure-identical: ${{ inputs.measure-identical }}
        artifact-name: bench-gate-${{ github.run_attempt }}
