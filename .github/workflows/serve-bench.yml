name: Serve benchmark

on:
  workflow_dispatch:
    inputs:
      bench:
        description: go test -bench regexp
        default: 'Serve|Route'
      benchtime:
        description: go test -benchtime
        default: '3x'
      count:
        description: go test -count
        default: '3'
  pull_request:
    paths:
    - server/serve_bench_test.go
    - server/route_bench_test.go
    - server/bench_helpers_test.go
    - server/bench_rusage_unix_test.go
    - server/bench_rusage_other_test.go
    - storage/storagetest/**
    - .github/workflows/serve-bench.yml

permissions:
  contents: read

jobs:
  serve-bench:
    name: Serve benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Log environment
      run: |
        {
          echo "nproc: $(nproc)"
          lscpu | head -20
          uname -a
          go version
          df -h .
          free -g
        } > env.txt 2>&1
        cat env.txt
        {
          echo '### Environment'
          echo '```'
          cat env.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build the test binary
      run: go test -c -o server.test ./server

    - name: Run benchmarks
      env:
        BENCH: ${{ inputs.bench || 'Serve|Route' }}
        BENCHTIME: ${{ inputs.benchtime || '3x' }}
        COUNT: ${{ inputs.count || '3' }}
      run: |
        set -o pipefail
        XET_BENCH_PROFILE_DIR="$PWD/prof" ./server.test -test.run '^$' -test.bench "$BENCH" -test.benchtime "$BENCHTIME" -test.count "$COUNT" -test.timeout 80m 2>&1 | tee bench.txt

    - name: Summarize with benchstat
      if: always()
      run: |
        set -o pipefail
        grep '^BenchmarkServe' bench.txt > serve.txt || true
        grep '^BenchmarkRoute' bench.txt > route.txt || true
        : > benchstat-serve.txt
        : > benchstat-route.txt
        if [ -s serve.txt ]; then
          go run golang.org/x/perf/cmd/benchstat@latest -row /size,/class -col /path serve.txt | tee benchstat-serve.txt
        fi
        if [ -s route.txt ]; then
          go run golang.org/x/perf/cmd/benchstat@latest -row /size,/class,/stage -col /revalidate route.txt | tee benchstat-route.txt
        fi
        {
          echo '### BenchmarkServe'
          echo '```'
          cat benchstat-serve.txt
          echo '```'
          echo '### BenchmarkRoute'
          echo '```'
          cat benchstat-route.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Summarize CPU profiles
      if: always()
      run: |
        : > prof-top.txt
        skipped=0
        for f in prof/*.pprof; do
          [ -e "$f" ] || continue
          top=$(go tool pprof -top -nodecount=30 server.test "$f" 2>&1 | head -45)
          printf '== %s\n%s\n\n' "$f" "$top" >> prof-top.txt
          # GitHub drops a step summary over 1 MiB; prof-top.txt keeps every top.
          if [ "$(wc -c < "$GITHUB_STEP_SUMMARY")" -ge 900000 ]; then
            skipped=$((skipped + 1))
            continue
          fi
          {
            echo "<details><summary>$(basename "$f")</summary>"
            echo
            echo '```'
            echo "$top"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$skipped" -gt 0 ]; then
          echo "$skipped more profile tops are in prof-top.txt of the serve-bench artifact." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: serve-bench
        path: |
          bench.txt
          serve.txt
          route.txt
          benchstat-*.txt
          prof-top.txt
          env.txt
          prof/
