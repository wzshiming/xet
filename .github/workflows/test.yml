name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run Go tests
      run: go test ./...

    - name: Build xetc
      run: go build -o xetc ./cmd/xetc

    - name: Build xetd
      run: go build -o xetd ./cmd/xetd

  conformance:
    name: Conformance Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: test/conformance/go.mod

    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Build xet-core reference
      working-directory: test/conformance
      run: cargo build --release --locked

    - name: Run conformance tests
      working-directory: test/conformance
      run: go test ./...
