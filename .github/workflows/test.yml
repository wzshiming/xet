name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run go fix
      run: |
        go fix ./...
        git diff --exit-code

    - name: Run Go tests
      run: go test ./...

    - name: Build xetc
      run: go build -o xetc ./cmd/xetc

    - name: Build xetd
      run: go build -o xetd ./cmd/xetd

  conformance:
    name: Conformance Tests (xet-core ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v1.8.0, v1.7.1, v1.6.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: test/conformance/go.mod

    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable

    - name: Build xet-core reference
      run: cargo build --release --locked --manifest-path test/conformance/versions/${{ matrix.version }}/Cargo.toml

    - name: Run conformance tests
      working-directory: test/conformance
      env:
        XET_CORE_VERSION: ${{ matrix.version }}
      run: go test ./...
