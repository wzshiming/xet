[package]
name = "xet-core-reference"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "xet-core-reference"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xet-core-structures = { git = "https://github.com/huggingface/xet-core", rev = "de71453d952bd8b806edaa997c72313051a49050" }
xet-data = { git = "https://github.com/huggingface/xet-core", rev = "de71453d952bd8b806edaa997c72313051a49050" }
xet-pkg = { git = "https://github.com/huggingface/xet-core", rev = "de71453d952bd8b806edaa997c72313051a49050", package = "hf-xet", features = ["no-default-cache"] }
xet-runtime = { git = "https://github.com/huggingface/xet-core", rev = "de71453d952bd8b806edaa997c72313051a49050", features = ["no-default-cache"] }
