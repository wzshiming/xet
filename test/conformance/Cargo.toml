[package]
name = "xet-core-reference"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "xet-core-reference"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
xet-core-structures = { git = "https://github.com/huggingface/xet-core", rev = "4b485713577a8f25d015953046210dc3d5d25ea5" }
xet-client = { git = "https://github.com/huggingface/xet-core", rev = "4b485713577a8f25d015953046210dc3d5d25ea5", features = ["simulation"] }
xet-data = { git = "https://github.com/huggingface/xet-core", rev = "4b485713577a8f25d015953046210dc3d5d25ea5" }
xet-pkg = { git = "https://github.com/huggingface/xet-core", rev = "4b485713577a8f25d015953046210dc3d5d25ea5", package = "hf-xet", features = ["no-default-cache"] }
xet-runtime = { git = "https://github.com/huggingface/xet-core", rev = "4b485713577a8f25d015953046210dc3d5d25ea5", features = ["no-default-cache"] }
